name: KhmerClipper
options:
  bundleIdPrefix: com.khmerclipper
  deploymentTarget:
    macOS: "15.0"
settings:
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  SWIFT_VERSION: "5.0"
packages:
  MASShortcut:
    url: https://github.com/cocoabits/MASShortcut
    revision: 6f2603c6b6cc18f64a799e5d2c9d3bbc467c413a
targets:
  KhmerClipper:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Tools
      - path: Resources
      - path: Vendor/tesseract
        type: folder
        buildPhase: resources
      - path: Vendor/trocr
        type: folder
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        NSScreenCaptureUsageDescription: "KhmerClipper needs to capture your screen to extract text from the region you select."
        NSMicrophoneUsageDescription: "Not used."
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "1"
    entitlements:
      path: Resources/KhmerClipper.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.camera: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khmerclipper.app
        PRODUCT_NAME: KhmerClipper
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MASShortcut
  OCRBench:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Tools/OCRBenchMain.swift
      - path: Sources/OCR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khmerclipper.ocrbench
        PRODUCT_NAME: OCRBench
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
        OTHER_CODE_SIGN_FLAGS: "--options=runtime"
  KhmerClipperTests:
    type: bundle.unit-test
    platform: macOS
    # Compiles the units under test directly (no TEST_HOST) so the suite runs as a
    # pure logic test without launching the menu-bar app.
    sources:
      - path: Tests
      - path: Sources/Capture/WindowPicker.swift
      - path: Sources/History/ScanRecord.swift
      - path: Sources/History/FeedbackMerge.swift
      - path: Sources/OCR/TesseractEngine.swift
      - path: Sources/OCR/TrOCREngine.swift
      - path: Sources/OCR/TrOCRTokenizer.swift
      - path: Sources/OCR/OCREngine.swift
      - path: Sources/OCR/OCRTextFormatter.swift
      - path: Sources/Reports/Report.swift
      - path: Sources/Reports/ReportOutbox.swift
      - path: Sources/Reports/CrashReporter.swift
      - path: Sources/Reports/FeedbackView.swift
      - path: Sources/Preferences/KeepCapturesDefault.swift
      # The vendored tesseract binary + tessdata, and the converted TrOCR
      # CoreML models, are what these OCR tests spawn/load. Tests point the
      # engines at Vendor/tesseract and Vendor/trocr directly, so those need
      # not be bundled here — kept out of sources on purpose.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khmerclipper.tests
